version: "3.9"

services:
  backend:
    build:
      context: ./backend-se
    container_name: backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend-se/.env
    restart: always

  frontend:
    build:
      context: ./fastcamp
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - ./fastcamp/.env.local
    depends_on:
      - backend
    restart: always